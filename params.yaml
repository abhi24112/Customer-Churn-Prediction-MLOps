data:
  test_size: 0.2
  random_state: 42

model:
  xgboost:
    model_status: true
    hpt_enabled: false
    params:
      objective: "binary:logistic"
      eval_metric: "logloss"
      n_estimators: 300
      learning_rate: 0.05
      max_depth: 4
      min_child_weight: 2
      subsample: 0.8
      colsample_bytree: 0.8
      n_jobs: -1
      tree_method: "hist"
      random_state: 42
      enable_categorical: true
      scale_pos_weight: 2.78

  catboost:
    model_status: true
    hpt_enabled: false
    params:
      loss_function: "Logloss"
      eval_metric: "F1"
      iterations: 1754
      learning_rate: 0.07966
      depth: 4
      l2_leaf_reg: 8.8768
      bootstrap_type: "Bernoulli"
      grow_policy: "SymmetricTree"
      random_seed: 42
      thread_count: -1
      verbose: false
      auto_class_weights: "Balanced"
      early_stopping_rounds: 50

  lightgbm:
    model_status: true
    hpt_enabled: false
    params:
      objective: "binary"
      metric: "binary_logloss"
      n_estimators: 1000
      learning_rate: 0.05
      num_leaves: 31
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      n_jobs: -1
      class_weight: "balanced"